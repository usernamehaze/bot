<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="cassie-app" content="1">
<title>Cassie</title>
<meta name="description" content="Cassie — your free AI study buddy.">
<meta name="theme-color" content="#100f16">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cassie">
<link rel="prefetch" href="app.html">
<link rel="prefetch" href="app.js?v=138">
<link rel="prefetch" href="style.css?v=138">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    min-height: 100vh; min-height: 100dvh;
    background: #100f16;
    background-image: radial-gradient(60% 50% at 50% 44%, #1b1a24 0%, #100f16 60%, #0b0a0f 100%);
    color: #f4efe4; overflow: hidden; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  /* Loading screen: the Cassie cursor drags across the word to highlight it,
     then clicks — and the click is the "loading". One loop = 3.4s. */
  :root { --loop: 3.4s; }
  .stage { position: relative; display: flex; flex-direction: column; align-items: center; gap: 20px; }
  .word {
    position: relative; display: inline-block; padding: .04em .14em; margin: 0 -.14em;
    font-size: clamp(3rem, 15vw, 5.6rem); font-weight: 800; letter-spacing: -.02em; line-height: 1.12;
    user-select: none; -webkit-user-select: none;
  }
  .word .t1 { color: #f4efe4; }
  /* the highlight: same word in dark ink on a light bar that grows with the drag */
  .word .sel {
    position: absolute; inset: 0; background: #f4efe4; border-radius: .09em; color: #100f16;
    padding: .04em .14em; clip-path: inset(0 100% 0 0);
    animation: select var(--loop) infinite;
  }
  @keyframes select {
    0%, 30% { clip-path: inset(0 100% 0 0); opacity: 1; transform: scale(1); }
    62% { clip-path: inset(0 0 0 0); opacity: 1; }
    78% { clip-path: inset(0 0 0 0); transform: scale(1); }
    81% { transform: scale(1.045); }          /* the click lands: the highlight pops */
    86% { transform: scale(1); }
    94% { opacity: 1; }
    97% { clip-path: inset(0 0 0 0); opacity: 0; }
    100% { clip-path: inset(0 100% 0 0); opacity: 0; }
  }

  /* the cursor — same arrow as the app icon. left/top are the arrow's TIP, in % of the word box */
  .cursor { position: absolute; left: 0; top: 0; width: .46em; height: .53em; font-size: clamp(3rem, 15vw, 5.6rem); pointer-events: none;
    transform-origin: 0 0; filter: drop-shadow(0 .03em .05em rgba(0,0,0,.55)); animation: cursor var(--loop) infinite; opacity: 0; }
  .cursor svg { display: block; width: 100%; height: 100%; overflow: visible; }
  @keyframes cursor {
    0%   { left: 118%; top: 165%; opacity: 0; transform: scale(1); }
    8%   { opacity: 1; }
    26%  { left: 0%; top: 58%; opacity: 1; transform: scale(1); animation-timing-function: ease-out; }
    30%  { left: 0%; top: 58%; transform: scale(.86); }   /* mouse down */
    62%  { left: 100%; top: 58%; transform: scale(.86); animation-timing-function: linear; }
    66%  { left: 100%; top: 58%; transform: scale(1); }   /* release */
    76%  { left: 100%; top: 58%; transform: scale(1); }
    79%  { left: 100%; top: 58%; transform: scale(.78); } /* click */
    84%  { left: 100%; top: 58%; transform: scale(1); }
    94%  { left: 100%; top: 58%; opacity: 1; }
    98%, 100% { left: 100%; top: 58%; opacity: 0; transform: scale(1); }
  }
  .ripple { position: absolute; left: 100%; top: 58%; width: .5em; height: .5em; font-size: clamp(3rem, 15vw, 5.6rem); margin: -.25em 0 0 -.25em; border: .02em solid rgba(244,239,228,.85); border-radius: 50%; opacity: 0; transform: scale(.2); pointer-events: none; animation: ripple var(--loop) infinite; }
  .ripple.r2 { animation-delay: .12s; }
  @keyframes ripple { 0%, 78% { opacity: 0; transform: scale(.2); } 80% { opacity: .9; } 92%, 100% { opacity: 0; transform: scale(2.3); } }

  .status { height: 1.2em; color: #bdb9ad; font-size: 1.05rem; letter-spacing: .16em; text-transform: lowercase; opacity: 0; animation: status var(--loop) infinite; }
  .status .d { animation: dots 1.1s infinite; }
  .status .d:nth-child(2) { animation-delay: .18s; } .status .d:nth-child(3) { animation-delay: .36s; }
  @keyframes status { 0%, 78% { opacity: 0; } 84%, 94% { opacity: 1; } 98%, 100% { opacity: 0; } }
  @keyframes dots { 0%, 60%, 100% { opacity: .25; } 30% { opacity: 1; } }

  .hint { position: fixed; left: 0; right: 0; bottom: clamp(26px,7vh,60px); text-align: center; color: rgba(255,255,255,.4); font-size: .8rem; letter-spacing: .04em; opacity: 0; transition: opacity .6s ease; }
  .hint.show { opacity: 1; }
  /* reduced motion: show the finished frame — word highlighted, cursor resting at its end */
  @media (prefers-reduced-motion: reduce) {
    .word .sel { animation: none; clip-path: inset(0 0 0 0); }
    .word .sel::after, .ripple { display: none; }
    .cursor { animation: none; left: 100%; top: 58%; opacity: 1; }
    .status { animation: none; opacity: 1; } .status .d { animation: none; }
  }
</style>
</head>
<body>
  <div class="stage" role="img" aria-label="Cassie loading">
    <div class="word">
      <span class="t1">Cassie</span>
      <span class="sel" aria-hidden="true">Cassie</span>
      <span class="ripple" aria-hidden="true"></span><span class="ripple r2" aria-hidden="true"></span>
      <span class="cursor" aria-hidden="true"><svg viewBox="100 80 305 350"><path d="M108 90 L395 259 L275 281 L342 399 L287 422 L225 300 L108 382 Z" fill="#fff" stroke="#0b0a0f" stroke-width="22" stroke-linejoin="round" paint-order="stroke"/></svg></span>
    </div>
    <div class="status">loading<span class="d">.</span><span class="d">.</span><span class="d">.</span></div>
  </div>
  <div class="hint" id="hint">tap anywhere to enter</div>

  <script>
    (function () {
      // Cloudflare Pages serves HTML at its extensionless clean URL and
      // 308-redirects /app.html -> /app; GitHub Pages needs the .html. Pick the
      // right target per host so navigation never hits a redirect.
      function target() {
        var h = location.hostname;
        if (h.indexOf('github.io') !== -1) return 'app.html';
        if (h === 'localhost' || h === '127.0.0.1' || location.protocol === 'file:') return 'app.html';
        return 'app';
      }
      var done = false;
      function go() { if (done) return; done = true; window.location.href = target(); }
      setTimeout(function () { var h = document.getElementById('hint'); if (h) h.classList.add('show'); }, 1400);
      document.body.addEventListener('click', go);
      setTimeout(go, 3900); // one full highlight-and-click, then in
    })();
  </script>
</body>
</html>
