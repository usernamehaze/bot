<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="cassie-app" content="1">
<title>Cassie</title>
<meta name="description" content="Cassie: your free AI study buddy.">
<meta name="theme-color" content="#f2f2f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e0e10" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cassie">
<link rel="prefetch" href="app.html">
<link rel="prefetch" href="app.js?v=214">
<link rel="prefetch" href="style.css?v=214">
<style>
  /* The way in from the website, as a launch screen (Apple's guidance: nearly identical to the
     app's first screen, no text, no logo, not a branding moment). Just the app's own background,
     in the student's look and the device's light or dark mode, then the app. Only when the app is
     slow to arrive does a small spinner appear. */
  * { box-sizing: border-box; }
  :root { --bg: #f2f2f5; --ink: #0e0e10; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0e0e10; --ink: #f2f2f5; } }
  html.cassie { --bg: #fbf6ee; --ink: #2a2320; } /* (Blush & Sage, picked in Appearance) */
  @media (prefers-color-scheme: dark) { html.cassie { --bg: #1a1614; --ink: #f6eee8; } }
  html, body { margin: 0; height: 100%; background: var(--bg); }
  body { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; cursor: pointer; }
  .spin { position: relative; width: 28px; height: 28px; opacity: 0; transition: opacity .2s; }
  .spin.on { opacity: 1; }
  .spin i { position: absolute; left: 12.5px; top: 1px; width: 3px; height: 8px; border-radius: 2px; background: var(--ink); transform-origin: 1.5px 13px; opacity: .18; animation: spoke .8s linear infinite; }
  .spin i:nth-child(1) { transform: rotate(0deg); animation-delay: -.7s; } .spin i:nth-child(2) { transform: rotate(45deg); animation-delay: -.6s; }
  .spin i:nth-child(3) { transform: rotate(90deg); animation-delay: -.5s; } .spin i:nth-child(4) { transform: rotate(135deg); animation-delay: -.4s; }
  .spin i:nth-child(5) { transform: rotate(180deg); animation-delay: -.3s; } .spin i:nth-child(6) { transform: rotate(225deg); animation-delay: -.2s; }
  .spin i:nth-child(7) { transform: rotate(270deg); animation-delay: -.1s; } .spin i:nth-child(8) { transform: rotate(315deg); animation-delay: 0s; }
  @keyframes spoke { 0% { opacity: .85; } 100% { opacity: .18; } }
  @media (prefers-reduced-motion: reduce) { .spin i { animation: none; opacity: .5; } }
</style>
</head>
<body>
  <span class="spin" role="progressbar" aria-label="Loading Cassie"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>

  <script src="start.js?v=214"></script>
</body>
</html>
