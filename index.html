<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cassie</title>
<meta name="description" content="Cassie — your free AI study buddy.">
<meta name="theme-color" content="#0e0d12">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cassie">
<!-- warm up the app so the jump is instant -->
<link rel="prefetch" href="app.html">
<link rel="prefetch" href="style.css">
<link rel="prefetch" href="app.js">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0e0d12; }
  body {
    min-height: 100vh; min-height: 100dvh;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; cursor: pointer;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  #loader {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    background: #0e0d12;
  }
  .enter {
    position: fixed; left: 50%; bottom: clamp(40px, 12vh, 120px);
    transform: translateX(-50%) translateY(10px);
    display: inline-flex; align-items: center; gap: 10px;
    background: #ff5fa2; color: #14121a;
    border: none; border-radius: 999px;
    padding: 14px 34px; font-size: 1rem; font-weight: 800;
    text-decoration: none; cursor: pointer;
    box-shadow: 0 10px 30px rgba(255,95,162,.34);
    opacity: 0; pointer-events: none;
    transition: opacity .6s ease, transform .6s ease;
  }
  .enter.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
  .enter svg { width: 17px; height: 17px; fill: currentColor; }
  .enter:hover { box-shadow: 0 14px 36px rgba(255,95,162,.44); }
  .skip { position: fixed; top: 18px; right: 20px; color: rgba(255,255,255,.5); font-size: .82rem; font-weight: 600; text-decoration: none; letter-spacing: .02em; opacity: 0; transition: opacity .6s ease; }
  .skip.show { opacity: 1; }
  .skip:hover { color: #fff; }
  @media (prefers-reduced-motion: reduce) {
    #loader { object-fit: contain; }
  }
</style>
</head>
<body>

  <video id="loader" autoplay muted loop playsinline poster="assets/loading-poster.jpg" aria-label="Cassie loading">
    <source src="assets/loading.webm" type="video/webm">
    <source src="assets/loading.mp4" type="video/mp4">
  </video>

  <a href="app.html" class="skip" id="skip">Skip →</a>
  <a href="app.html" class="enter" id="enter">
    askCassie
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11h12.2l-5.6-5.6L12 4l8 8-8 8-1.4-1.4 5.6-5.6H4z"/></svg>
  </a>

  <script>
    (function () {
      var done = false;
      function go() {
        if (done) return;
        done = true;
        window.location.href = 'app.html';
      }
      // reveal the enter/skip buttons shortly after load
      setTimeout(function () {
        var e = document.getElementById('enter'); if (e) e.classList.add('show');
        var s = document.getElementById('skip'); if (s) s.classList.add('show');
      }, 1400);
      // tap/click anywhere continues to the app
      document.body.addEventListener('click', function (ev) {
        // let the actual links navigate on their own
        if (ev.target.closest('a')) return;
        go();
      });
      // auto-continue after the animation has had time to play
      setTimeout(go, 6500);
      // if the video can't load at all, don't strand the user
      var v = document.getElementById('loader');
      if (v) v.addEventListener('error', function () { setTimeout(go, 1200); });
    })();
  </script>

</body>
</html>
