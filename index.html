<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cassie</title>
<meta name="description" content="Cassie — your free AI study buddy.">
<meta name="theme-color" content="#0e0d12">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cassie">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #0e0d12;
    color: #f2f0f7;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh; min-height: 100dvh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 24px;
    -webkit-font-smoothing: antialiased;
    /* soft pink glow behind the centre */
    background-image: radial-gradient(60% 45% at 50% 42%, rgba(255,95,162,.14), transparent 70%);
  }
  .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 40px; }
  .robot { width: 60px; height: 72px; animation: float 4.5s ease-in-out infinite; }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  .r-body, .r-head, .r-ear { fill: #f2f0f7; }
  .r-ant { stroke: #f2f0f7; stroke-width: 3; stroke-linecap: round; }
  .r-tip, .r-eye { fill: #ff5fa2; }
  .r-screen { fill: #0e1626; }
  .r-cheek { fill: rgba(255,95,162,.55); }
  .name { font-size: 2.6rem; font-weight: 700; letter-spacing: -.02em; }
  .name .c { color: #ff5fa2; }

  .enter {
    margin-top: 4px;
    display: inline-flex; align-items: center; gap: 10px;
    background: #ff5fa2; color: #14121a;
    border: none; border-radius: 999px;
    padding: 16px 40px;
    font-size: 1.05rem; font-weight: 800; letter-spacing: .01em;
    text-decoration: none; cursor: pointer;
    box-shadow: 0 10px 30px rgba(255,95,162,.32);
    transition: transform .1s ease, box-shadow .1s ease, background .1s ease;
  }
  .enter:hover { transform: translateY(-2px); box-shadow: 0 14px 36px rgba(255,95,162,.42); }
  .enter:active { transform: translateY(1px); }
  .enter svg { width: 18px; height: 18px; fill: currentColor; }

  .tag { position: fixed; bottom: 26px; left: 0; right: 0; font-size: .72rem; letter-spacing: .28em; color: #6b6980; text-transform: uppercase; }
</style>
</head>
<body>

  <div class="brand">
    <svg class="robot" viewBox="0 0 72 92" aria-hidden="true">
      <line class="r-ant" x1="36" y1="15" x2="36" y2="7"/>
      <circle class="r-tip" cx="36" cy="5" r="3.4"/>
      <rect class="r-ear" x="3" y="31" width="6" height="16" rx="3"/>
      <rect class="r-ear" x="63" y="31" width="6" height="16" rx="3"/>
      <path class="r-body" d="M17 60 h38 a11 11 0 0 1 11 11 v10 a3 3 0 0 1 -3 3 h-54 a3 3 0 0 1 -3 -3 v-10 a11 11 0 0 1 11 -11 z"/>
      <rect class="r-head" x="9" y="15" width="54" height="46" rx="18"/>
      <rect class="r-screen" x="15" y="21" width="42" height="34" rx="14"/>
      <rect class="r-eye" x="23" y="31" width="8" height="14" rx="4"/>
      <rect class="r-eye" x="41" y="31" width="8" height="14" rx="4"/>
      <circle class="r-cheek" cx="20" cy="48" r="3.4"/>
      <circle class="r-cheek" cx="52" cy="48" r="3.4"/>
    </svg>
    <span class="name">Cassie</span>
  </div>

  <a href="app.html" class="enter">
    askCassie
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11h12.2l-5.6-5.6L12 4l8 8-8 8-1.4-1.4 5.6-5.6H4z"/></svg>
  </a>

  <div class="tag">Study Buddy</div>

</body>
</html>
