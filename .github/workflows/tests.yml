name: Cassie tests

# Opens Cassie in a real browser and checks the main features. Every push runs the fast suite (every test but
# the slowest); each night, and when started by hand, the full suite runs.
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 18 * * *'   # 2:17 in the morning, Philippine time

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && 40 || 90 }}
    env:
      SUITE: ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && 'fast' || '' }}
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4
      - name: No file over 25 MB (Cloudflare Pages refuses them and the website stops updating)
        working-directory: .
        run: |
          big=$(git ls-files -z | xargs -0 du -b | awk '$1 > 25*1024*1024 {print $2}')
          if [ -n "$big" ]; then echo "Too big for Cloudflare Pages: $big"; exit 1; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Check the server bundle is up to date
        working-directory: server
        run: |
          python3 build.py
          git diff --exit-code worker.js || (echo "server/worker.js is out of date — run python3 build.py in server/" && exit 1)
