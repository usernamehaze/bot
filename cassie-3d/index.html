<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#121214" />
    <title>Cassie</title>
    <meta name="description" content="Cassie — your free AI study buddy." />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Cassie" />
    <link rel="prefetch" href="app.html" />
    <style>
      html, body, #root { height: 100%; margin: 0; background: #121214; }
      #boot {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        background: #121214; color: #fff; font-family: system-ui, -apple-system, sans-serif;
        font-size: 2rem; font-weight: 700; letter-spacing: -0.01em;
      }
    </style>
    <script>
      // If the device has no WebGL, skip the 3D loader and go straight to the app.
      (function () {
        try {
          var c = document.createElement('canvas');
          var gl = c.getContext('webgl') || c.getContext('experimental-webgl');
          if (!gl) window.location.replace('app.html');
        } catch (e) {
          window.location.replace('app.html');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"><div id="boot">Cassie</div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
