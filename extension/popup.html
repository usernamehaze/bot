<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Cassie settings</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    width: 280px;
    margin: 0;
    padding: 16px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #1c1d2b;
  }
  h1 {
    font-size: 15px;
    margin: 0 0 4px;
  }
  .subtitle {
    font-size: 12px;
    color: #6b6f8a;
    margin: 0 0 14px;
  }
  label {
    display: block;
    font-size: 12px;
    color: #6b6f8a;
    margin-bottom: 5px;
  }
  input, select {
    width: 100%;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid #e6e2f5;
    font-size: 13px;
    margin-bottom: 12px;
  }
  .hint {
    font-size: 11px;
    color: #6b6f8a;
    line-height: 1.4;
    margin: -6px 0 14px;
  }
  button {
    width: 100%;
    background: #6d28d9;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 9px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  button:active { background: #5b21b6; }
  #status {
    font-size: 12px;
    color: #16a34a;
    margin-top: 8px;
    min-height: 14px;
    text-align: center;
  }
</style>
</head>
<body>
  <h1>Cassie</h1>
  <p class="subtitle">Highlight text on any page to get an explanation or answer.</p>

  <label for="api-key">Anthropic API key</label>
  <input type="password" id="api-key" placeholder="sk-ant-...">
  <p class="hint">
    Stored only in this browser (extension storage) — never sent anywhere
    except directly to Anthropic's API. Get a key at console.anthropic.com.
  </p>

  <label for="model">Model</label>
  <select id="model">
    <option value="claude-sonnet-5">Sonnet 5 — smartest, best for tutoring</option>
    <option value="claude-haiku-4-5-20251001">Haiku 4.5 — fastest, lighter</option>
  </select>

  <button type="button" id="save">Save</button>
  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
