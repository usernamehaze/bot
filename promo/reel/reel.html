<!doctype html>
<html><head><meta charset="utf-8"><title>Cassie reel</title>
<link rel="stylesheet" href="../source/assets/inter-local.css">
<style>
  :root { --ink: #121116; --pearl: #f6f2ec; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #111; font-family: Inter, system-ui, sans-serif; }
  #frame { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  #bg { position: absolute; inset: 0; }
  #stage { position: absolute; inset: 0; z-index: 3; }
  .layer { position: absolute; inset: 0; z-index: 4; pointer-events: none; }
  .back { z-index: 2; }

  /* reel captions: white pills, heavy black type */
  .cap { position: absolute; left: 0; right: 0; top: 250px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .cap .pill { background: #fff; color: var(--ink); font-weight: 850; font-size: 66px; letter-spacing: -.035em; line-height: 1; padding: 18px 30px 22px; border-radius: 26px; box-shadow: 0 14px 40px rgba(0,0,0,.18); white-space: nowrap; }
  .cap .pill.dark { background: var(--ink); color: #fff; }
  .cap .pill.small { font-size: 46px; font-weight: 700; padding: 14px 26px 18px; }
  .hl { position: relative; display: inline-block; }
  .hl .sel { position: absolute; inset: -4px -10px; background: #ffe066; border-radius: 10px; z-index: -1; transform-origin: left center; }
  .cursor { position: absolute; width: 64px; height: 74px; z-index: 9; filter: drop-shadow(0 6px 10px rgba(0,0,0,.35)); }

  /* phone mock for the highlight demo */
  .phone { position: absolute; left: 140px; top: 820px; width: 800px; height: 900px; border-radius: 64px; background: #fbfaf7; box-shadow: 0 40px 120px rgba(0,0,0,.35), inset 0 0 0 12px #17161b; overflow: hidden; }
  .phone .bar { height: 120px; display: flex; align-items: flex-end; padding: 0 56px 18px; font: 600 26px Inter; color: #6d6a70; border-bottom: 1px solid #eee; }
  .phone .doc { padding: 40px 56px; font-size: 36px; line-height: 1.55; color: #2a282e; }
  .phone .doc h4 { margin: 0 0 18px; font-size: 48px; letter-spacing: -.02em; color: #121116; }
  .phone mark { background: transparent; position: relative; color: inherit; }
  .phone mark .sw { position: absolute; left: -4px; right: -4px; top: 4px; bottom: 2px; background: #bcd8ff; border-radius: 6px; z-index: -1; transform-origin: left center; }
  .pop { position: absolute; left: 70px; right: 70px; top: 600px; background: #17161b; color: #fff; border-radius: 30px; padding: 26px 32px 32px; box-shadow: 0 30px 60px rgba(0,0,0,.35); font-size: 32px; line-height: 1.45; }
  .pop .ph { font: 800 22px Inter; letter-spacing: .18em; color: #b9b5bd; margin-bottom: 12px; }
  .pop b { color: #ffe066; }

  /* app chip row replica */
  .chips { position: absolute; left: 0; right: 0; top: 1560px; display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; padding: 0 60px; }
  .chip { background: rgba(255,255,255,.88); color: var(--ink); font: 700 34px Inter; padding: 16px 28px; border-radius: 999px; box-shadow: 0 8px 22px rgba(0,0,0,.12); transition: none; }
  .chip.on { background: var(--ink); color: #fff; transform: scale(1.08); }
  .seg { display: inline-flex; background: rgba(255,255,255,.88); border-radius: 999px; padding: 6px; box-shadow: 0 8px 22px rgba(0,0,0,.12); }
  .seg span { font: 700 34px Inter; padding: 12px 26px; border-radius: 999px; color: #6d6a70; }
  .seg span.on { background: var(--ink); color: #fff; }
  .label { position: absolute; left: 0; right: 0; top: 1290px; text-align: center; }
  .label h2 { margin: 0; font-size: 92px; font-weight: 900; letter-spacing: -.045em; color: #fff; text-shadow: 0 8px 30px rgba(0,0,0,.25); }
  .label p { margin: 10px 0 0; font-size: 42px; font-weight: 650; color: rgba(255,255,255,.9); }

  /* cards */
  .card { position: absolute; background: #fff; border-radius: 28px; box-shadow: 0 30px 70px rgba(0,0,0,.25); }
  .pdf { width: 300px; height: 380px; padding: 28px; }
  .pdf .tag { display: inline-block; background: #e5484d; color: #fff; font: 800 28px Inter; padding: 6px 14px; border-radius: 10px; }
  .pdf .ln { height: 16px; background: #e8e5e0; border-radius: 8px; margin-top: 22px; }
  .pdf .nm { font: 700 26px Inter; color: #333; margin-top: 18px; }
  .file { left: 120px; right: 120px; top: 1330px; padding: 28px 30px; display: flex; align-items: center; gap: 26px; }
  .file .ico { width: 84px; height: 100px; border-radius: 16px; background: #2b579a; color: #fff; font: 900 30px Inter; display: grid; place-items: center; }
  .file b { display: block; font-size: 36px; color: var(--ink); letter-spacing: -.02em; }
  .file small { font-size: 28px; color: #6d6a70; }
  .file .dl { margin-left: auto; background: var(--ink); color: #fff; font: 800 30px Inter; padding: 18px 26px; border-radius: 999px; }
  .slide { width: 260px; height: 160px; padding: 20px; border-radius: 18px; }
  .slide .t { height: 18px; width: 60%; background: #222; border-radius: 6px; }
  .slide .l { height: 10px; background: #ddd; border-radius: 5px; margin-top: 14px; }
  .clock { position: absolute; left: 0; right: 0; top: 520px; text-align: center; font: 900 220px Inter; letter-spacing: -.06em; color: rgba(255,255,255,.95); text-shadow: 0 20px 60px rgba(0,0,0,.35); }
  .ring { position: absolute; left: 340px; top: 470px; width: 400px; height: 400px; }
  .ring .t { position: absolute; inset: 0; display: grid; place-items: center; font: 900 96px Inter; color: #fff; letter-spacing: -.04em; }
  .ring .m { position: absolute; left: 0; right: 0; top: 268px; text-align: center; font: 700 32px Inter; color: rgba(255,255,255,.85); }
  .cta { position: absolute; left: 0; right: 0; top: 330px; text-align: center; color: #fff; }
  .cta .logo { display: inline-flex; align-items: center; gap: 22px; font: 900 120px Inter; letter-spacing: -.05em; }
  .cta .logo i { width: 120px; height: 120px; border-radius: 30px; background: #fff; display: grid; place-items: center; }
  .cta p { margin: 26px 0 0; font: 750 54px Inter; letter-spacing: -.03em; }
  .cta .url { display: inline-block; margin-top: 1060px; background: #fff; color: var(--ink); font: 850 50px Inter; padding: 22px 40px; border-radius: 999px; box-shadow: 0 20px 50px rgba(0,0,0,.3); }
  .flash { position: absolute; inset: 0; background: #fff; z-index: 8; opacity: 0; }
</style></head>
<body>
<div id="frame">
  <canvas id="bg" width="540" height="960"></canvas>
  <div class="layer back" id="back"></div>
  <div id="stage"></div>
  <div class="layer" id="front"></div>
  <div class="flash" id="flash"></div>
</div>
<script src="build/cassie-stage.js"></script>
<script src="reel.js"></script>
</body></html>
